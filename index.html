if(d?.step===2)return`<div class="auth stack">${hd}<p class="muted">Step 2 of 2</p><h2>What do you love to read, ${E(d.name.split(' ')[0])}?</h2><p>Pick your favourite genres and we’ll tailor your shelf.</p>${gcards(d.g,'pick')}<div class="row"><button class="btn alt" data-a="back">Back</button><button class="btn" data-a="regfin">Finish</button></div><div id="aerr" class="muted" role="alert"></div></div>`;
if(UI.mode==='in')return`<div class="auth stack">${hd}<h2>Welcome back</h2><input id="ae" type="email" placeholder="Email" autocomplete="email"><input id="ap" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" data-a="login">Sign in</button><div id="aerr" class="muted" role="alert"></div><button class="chip" data-a="mode" data-id="up">Create a new account</button></div>`;
return`<div class="auth stack">${hd}<p class="muted">Step 1 of 2</p><h2>Create your account</h2><input id="an" value="${E(d?.name)}" placeholder="Your name" autocomplete="name"><input id="ae" type="email" value="${E(d?.email)}" placeholder="Email" autocomplete="email"><input id="ap" type="password" placeholder="${d?.h?'Leave blank to keep your password':'Password (8+ characters)'}" autocomplete="new-password"><button class="btn" data-a="next">Continue</button><div id="aerr" class="muted" role="alert"></div><button class="chip" data-a="mode" data-id="in">I already have an account</button></div>`}
const modal=h=>{const m=$('#modal');m.innerHTML=`<div class="card" role="dialog" aria-modal="true">${h}<div style="margin-top:1rem"><button class="btn alt sm" data-a="close">Close</button></div></div>`;m.classList.add('open')};
const closeM=()=>$('#modal').classList.remove('open');
function bookModal(id){const b=B[id],l=S.lib[id];modal(`<div class="rec">${cover(b)}<div><h2>${E(b.t)}</h2><div class="muted">${E(b.a)} · ${b.g} · ${b.y} · ★ ${b.r} · ${b.p} pages · ~${hrs(b)}h</div><p>${E(b.d)}</p>${l?`<p><b>${{want:'On your Want to Read list',now:'Reading: '+l.pg+'/'+b.p+' pages',done:'Completed · '+'★'.repeat(l.r||0)}[l.s]}</b></p>`:''}</div></div><div class="row wrap" style="margin-top:1rem">${!l?`<button class="btn sm" data-a="add" data-id="${id}" data-s="want">Add to Library</button><button class="btn sm alt" data-a="add" data-id="${id}" data-s="now">Start Reading</button>`:''}${l?.s==='want'?`<button class="btn sm" data-a="add" data-id="${id}" data-s="now">Start Reading</button>`:''}${l?.s==='now'?`<input id="pgs" type="number" min="0" max="${b.p}" value="${l.pg}" style="width:100px" aria-label="Pages read"><button class="btn sm" data-a="prog" data-id="${id}">Update pages</button>`:''}${l&&l.s!=='done'?`<button class="btn sm" data-a="rate" data-id="${id}">Mark as Completed</button>`:''}${l?`<button class="btn sm alt" data-a="rm" data-id="${id}">Remove</button>`:''}<button class="btn sm alt" data-a="wish" data-id="${id}">${S.fav.includes(id)?'♥ Saved to Favourites':'♡ Save to Favourites'}</button></div><div class="row" style="margin-top:.8rem"><input id="ln" list="lsts" placeholder="Add to a reading list…" aria-label="List name"><datalist id="lsts">${Object.keys(S.lists).map(n=>`<option value="${E(n)}">`).join('')}</datalist><button class="btn sm" data-a="tolist" data-id="${id}">Add</button></div>`)}
function rateModal(id){UI.star=0;modal(`<h2>How was ${E(B[id].t)}?</h2><div id="stars">${[1,2,3,4,5].map(n=>`<button class="star" data-a="star" data-id="${n}" aria-label="${n} stars">☆</button>`).join('')}</div><textarea id="rv" rows="3" placeholder="Write a review (optional)"></textarea><button class="btn" style="margin-top:.6rem" data-a="finish" data-id="${id}">Save and see what’s next</button>`)}
function thread(id){const c=[...CL,...S.myClubs].find(x=>x.id===id),m=S.clubMsgs[id]||[];modal(`<h2>${E(c.n)}</h2><div class="stack">${m.map(x=>`<div><b>${E(S.user.name)}</b> <span>${E(x)}</span></div>`).join('')||'<div class="muted">No messages yet. Start the discussion.</div>'}</div><div class="row" style="margin-top:1rem"><input id="tm" placeholder="Share your thoughts"><button class="btn sm" data-a="tmsg" data-id="${id}">Send</button></div>`)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id,v=s=>$(s)?.value||'';
try{switch(a){
case'close':closeM();return;case'book':bookModal(+id);return;
case'pick':{const d=S.draft;d.g=d.g.includes(id)?d.g.filter(x=>x!==id):[...d.g,id];break}
case'more':UI.n+=12;break;case'dmore':UI.dn+=24;break;case'shuffle':S.seed=(S.seed||0)+1;UI.n=24;break;
case'wish':{const k=+id;S.fav=S.fav.includes(k)?S.fav.filter(x=>x!==k):[...S.fav,k];toast(S.fav.includes(k)?'Saved to Favourites':'Removed from Favourites');bookModal(k);break}
case'eye':{const i=$('#ap');if(i){const sh=i.type==='password';i.type=sh?'text':'password';t.innerHTML=sh?EYEOFF:EYE;t.setAttribute('aria-label',sh?'Hide password':'Show password')}return}
case'tolist':{const n=v('#ln').trim();if(!n){toast('Name your list first');return}const L=S.lists[n]=S.lists[n]||[];if(!L.includes(+id))L.push(+id);toast('Added to “'+n+'”');bookModal(+id);break}
case'dellist':delete S.lists[id];break;
case'setsave':{const n=v('#sn').trim(),cc=v('#sc'),pn=v('#sp').replace(/[\s-]/g,'');if(!n)return aerr('Name can’t be empty.');const pe=pn?phoneErr(cc,pn):'';if(pe)return aerr(pe);if(pn&&Object.values(S.accounts).some(a=>a.email!==S.user.email&&a.cc===cc&&a.pn===pn))return aerr('That phone number is already registered.');Object.assign(S.user,{name:n,cc,pn});toast('Saved');break}
case'next':authNext();return;case'regfin':authFinish();return;case'login':authLogin();return;
case'back':S.draft.step=1;break;case'mode':UI.mode=id;break;
case'theme':{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('bv-theme',n)}catch(e){}break}

case'out':S.user=null;UI.mode='in';break;
case'gen':UI.genre=UI.genre===id?'':id;UI.n=24;UI.dn=24;break;case'gotog':UI.genre=id;location.hash='discover';break;
case'hsearch':UI.q=v('#hq');location.hash='discover';break;
case'tab':UI.tab=id;break;
case'add':S.lib[id]={s:t.dataset.s,pg:0};act();toast(t.dataset.s==='now'?'Started reading':'Added to your library');bookModal(+id);break;
case'rm':delete S.lib[id];closeM();toast('Removed from library');break;
case'prog':{const n=Math.max(0,Math.min(B[id].p,+v('#pgs')||0));S.lib[id].pg=n;act();if(n>=B[id].p){rateModal(+id);return}toast('Progress saved');bookModal(+id);break}
case'rate':rateModal(+id);return;
case'star':UI.star=+id;document.querySelectorAll('.star').forEach((s,i)=>s.textContent=i<UI.star?'★':'☆');return;
case'finish':{if(!UI.star){toast('Tap a star rating first');return}const b=B[id],rv=v('#rv').trim();S.lib[id]={s:'done',pg:b.p,r:UI.star,rv,on:new Date().toISOString()};act();if(rv)S.posts.unshift({id:'u'+Date.now(),by:'me',t:'Review: '+rv,b:+id,l:0,c:[],ts:'just now'});note(`You finished ${b.t}. New recommendations are ready.`);const r=recs().slice(0,3);modal(`<h2>${UI.star>=4?'Because You Loved '+E(b.t):'Your Next Read'}</h2><div class="stack">${r.map(recCard).join('')}</div>`);render();return}
case'goal':{const g=+prompt('How many books do you want to read this year?',S.goal);if(g>0)S.goal=Math.min(g,500);break}
case'post':{const tx=v('#pt').trim();if(!tx){toast('Write something first');return}S.posts.unshift({id:'u'+Date.now(),by:'me',t:tx,b:v('#pb'),l:0,c:[],ts:'just now'});act();toast('Posted');break}
case'like':S.liked=S.liked.includes(id)?S.liked.filter(x=>x!==id):[...S.liked,id];break;
case'sav':S.sav=S.sav.includes(id)?S.sav.filter(x=>x!==id):[...S.sav,id];toast(S.sav.includes(id)?'Saved':'Removed from saved');break;
case'cmt':{const c=prompt('Add a comment');if(c?.trim())S.posts.find(p=>p.id===id).c.push({by:'me',t:c.trim()});break}
case'share':{const p=S.posts.find(p=>p.id===id);navigator.clipboard?.writeText(`${nm(p.by)} on BookVerse: ${p.t}`).then(()=>toast('Copied to clipboard'),()=>toast('Copy not available here'));return}
case'fol':S.fol=S.fol.includes(id)?S.fol.filter(x=>x!==id):[...S.fol,id];if(S.fol.includes(id))note('You’re now following '+nm(id));break;
case'join':S.joined=S.joined.includes(id)?S.joined.filter(x=>x!==id):[...S.joined,id];if(S.joined.includes(id))note('You joined a book club');break;
case'mkclub':{const n=v('#cn').trim();if(!n){toast('Name your club first');return}const c={id:'m'+Date.now(),n,d:'A club created by you.',m:0};S.myClubs.push(c);S.joined.push(c.id);break}
case'thread':thread(id);return;
case'tmsg':{const m=v('#tm').trim();if(!m)return;(S.clubMsgs[id]=S.clubMsgs[id]||[]).push(m);save();thread(id);return}
case'pg':S.user.g=S.user.g.includes(id)?S.user.g.filter(x=>x!==id):[...S.user.g,id];if(!S.user.g.length)S.user.g=[id];break;
case'fav':S.user.a=v('#fa').trim();toast('Saved');break;
case'bio':S.user.bio=v('#bio').trim();toast('Bio saved');break}}catch(x){toast('Something went wrong. Please try again.')}
save();render()});
document.addEventListener('input',e=>{if(e.target.id==='dq'){UI.q=e.target.value;UI.dn=24;$('#dg').innerHTML=gridFor()}});
document.addEventListener('change',e=>{if(e.target.id==='ds'){UI.sort=e.target.value;$('#dg').innerHTML=gridFor()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('bk'))e.target.click();if(e.key==='Escape')closeM()});
addEventListener('hashchange',()=>{closeM();render();scrollTo(0,0)});render();
</script></body></html>
